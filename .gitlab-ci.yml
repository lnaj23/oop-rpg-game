image: maven:4.0.0-rc-5-ibm-semeru-25-noble

stages:
  - test
  - release

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

test:
  stage: test
  script:
    - mvn test
release_job:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - mvn package
  artifacts:
    paths:
      - target/*.jar
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"